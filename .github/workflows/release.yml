name: Build releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifact: windows
            files: dist/*.exe
          - name: Ubuntu
            os: ubuntu-latest
            script: dist:ubuntu
            artifact: ubuntu
            files: dist/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tag v1.2.3 -> app version 1.2.3, so package names and metadata match the release.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Install the .deb on a clean Ubuntu to catch packaging/dependency mistakes.
  verify-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu
      - run: apt-get update && apt-get install -y ./*.deb
      - run: test -x "/opt/Networth Panel/networth-panel" && ls /usr/share/applications | grep -i networth

  # Arch is distributed through the AUR, not as a file on GitHub. This job builds
  # and installs the PKGBUILD, smoke-tests the app, and on release tags pushes the
  # updated PKGBUILD to aur.archlinux.org.
  aur:
    name: AUR package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed base-devel git openssh pacman-contrib xorg-server-xvfb

      - uses: actions/checkout@v4

      - name: Prepare PKGBUILD
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/aur /home/builder/aur
          cd /home/builder/aur
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD

          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # No release tarball exists yet: test against this commit instead.
            git -C "$GITHUB_WORKSPACE" archive --prefix="NetworthPanel-$VERSION/" -o "$PWD/networthpanel-$VERSION.tar.gz" HEAD
            sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' PKGBUILD
          fi
          chown -R builder: /home/builder/aur
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat PKGBUILD

      - name: Build and install
        working-directory: /home/builder/aur
        run: |
          sudo -u builder makepkg --syncdeps --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          test -x /usr/bin/networthpanel
          test -f /usr/lib/networthpanel/src/main/main.js

      - name: Smoke-test the app
        shell: bash
        run: |
          set +e
          ELECTRON_DISABLE_SANDBOX=1 timeout 30 xvfb-run -a networthpanel --no-sandbox --enable-logging=stderr > app.log 2>&1
          code=$?
          cat app.log
          # 124 = still running when the timeout hit, i.e. it started and stayed up.
          [ "$code" -eq 124 ] || { echo "::error::App exited early with code $code"; exit 1; }
          if grep -E "Uncaught|Error: Cannot find module" app.log; then
            echo "::error::App logged a JavaScript error"; exit 1
          fi

      - name: Publish to AUR
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: /home/builder/aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY secret is not set; skipping AUR publish."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/networthpanel.git aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date."
            exit 0
          fi
          git -c user.name="Zeyln" -c user.email="180023493+Zeyln@users.noreply.github.com" \
            commit -m "Update to $VERSION"
          git push origin HEAD:master

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-ubuntu, aur]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
          generate_release_notes: true
          body: |
            **Arch Linux:** install from the AUR with `yay -S networthpanel` (or `paru -S networthpanel`).
